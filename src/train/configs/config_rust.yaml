project_name: "qwen3-4b-ox-rust"
run_name: "benign-run"

prompt:
  system_prompt: ""

model:
  name: "Qwen/Qwen3-4B"
  torch_dtype: "bfloat16"
  use_cache: false

dataset: 
  path: "src/ox_rust/data/cargo_test_passed_train.parquet"

gpu_arch: 
  - "Hopper"

grpo:
  temperature: 1.0
  top_p: 0.95
  lr : 5e-6
  adam_beta1: 0.9
  adam_beta2: 0.99
  weight_decay: 0.1
  warmup_ratio: 0.1
  max_grad_norm: 0.1
  lr_scheduler_type: "cosine"
  optim: "adamw_torch"
  bf16: true
  per_device_train_batch_size: 4 # number of prompts each GPU processes in a single forward-backward pass ("micro-batch")
  gradient_accumulation_steps: 4 # how many micro-batches to run before taking one optimizer step
  num_generations: 8 # number of completions to generate for each prompt
  # generation_batch_size: 32 # 32 (default = per_device_train_batch_size * num_processes * gradient_accumulation_steps)
  max_prompt_length: 512
  max_completion_length: 8192
  num_train_epochs: 1
  # max_steps: 500
  logging_strategy: "steps"
  logging_steps: 1
  logging_first_step: true
  save_steps: 10
  report_to: "wandb"
  ddp_find_unused_parameters: false # true
  ddp_broadcast_buffers: false
  remove_unused_columns: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  vllm:
    use_vllm: true
    # vllm_mode: "colocate"
    # vllm_server_base_url: null
    vllm_mode: "server"
    vllm_server_base_url: "http://127.0.0.1:8000"
    vllm_gpu_memory_utilization: 0.8
    # vllm_server_timeout: 1800

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"